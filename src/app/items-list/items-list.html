<div class="list-wrapper">
  <h2>Main tools for web development</h2>

  <input
    type="text"
    placeholder="Search..."

    [(ngModel)]="searchTerm"

    (ngModelChange)="onSearchChange()"

    class="search-input"
  >

  <div *ngIf="tools$ | async as tools">

    <div *ngFor="let tool of tools" class="list-item">

      <app-item-card
        [tool]="tool"
        (selectTool)="onToolSelected($event)">
      </app-item-card>

    </div>

  </div>
</div>
