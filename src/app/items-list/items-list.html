<div class="list-wrapper">
  <h2>Main tools of the web development</h2>

  <input
    type="text"
    placeholder="Search..."
    [(ngModel)]="searchTerm"
    class="search-input"
  >

  <div *ngFor="let tool of filteredTools" class="list-item">

    <app-item-card
      [tool]="tool"
      (selectTool)="onToolSelected($event)">
    </app-item-card>

  </div>
</div>
